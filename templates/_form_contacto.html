<form class="form reveal" data-delay="1" id="contactForm" novalidate>
  <div class="field"><label for="f-nombre">Nombre y apellidos <span class="req">*</span></label><input id="f-nombre" name="nombre" type="text" required autocomplete="name" placeholder="Tu nombre"></div>
  <div class="field"><label for="f-negocio">Nombre del negocio o proyecto <span class="req">*</span></label><input id="f-negocio" name="negocio" type="text" required placeholder="Tu local o proyecto"></div>
  <div class="field"><label for="f-ciudad">Ciudad</label><input id="f-ciudad" name="ciudad" type="text" placeholder="Ciudad"></div>
  <div class="field"><label for="f-email">Email <span class="req">*</span></label><input id="f-email" name="email" type="email" required autocomplete="email" placeholder="tu@email.com"></div>
  <div class="field"><label for="f-tel">Teléfono / WhatsApp</label><input id="f-tel" name="telefono" type="tel" autocomplete="tel" placeholder="+34 ..."></div>
  <div class="field"><label for="f-tipo">Tipo de negocio</label>
    <select id="f-tipo" name="tipo"><option value="">Selecciona…</option><option>Bar</option><option>Restaurante</option><option>Cafetería</option><option>Taberna</option><option>Concepto nuevo</option><option>Otro</option></select>
  </div>
  <div class="field field--full"><label for="f-momento">Momento del proyecto</label>
    <select id="f-momento" name="momento"><option value="">Selecciona…</option><option>Apertura</option><option>Reorganización</option><option>Crecimiento</option><option>Digitalización</option><option>Otro</option></select>
  </div>
  <div class="field field--full">
    <label>Qué necesitas mejorar</label>
    <div class="checks">
      <label class="check"><input type="checkbox" name="mejora" value="Operativa"> Operativa</label>
      <label class="check"><input type="checkbox" name="mejora" value="Documentación"> Documentación</label>
      <label class="check"><input type="checkbox" name="mejora" value="Marca"> Marca</label>
      <label class="check"><input type="checkbox" name="mejora" value="Formación"> Formación</label>
      <label class="check"><input type="checkbox" name="mejora" value="Tecnología"> Tecnología</label>
      <label class="check"><input type="checkbox" name="mejora" value="ERP"> ERP</label>
    </div>
  </div>
  <div class="field field--full"><label for="f-msg">Mensaje</label><textarea id="f-msg" name="mensaje" placeholder="Cuéntanos brevemente en qué punto está tu negocio…"></textarea></div>
  <div class="field field--full">
    <label class="consent"><input type="checkbox" name="consent" required> Acepto la <a href="/politica-de-privacidad">política de privacidad</a> y el tratamiento de mis datos para responder a mi solicitud. <span class="req">*</span></label>
  </div>
  <div class="field field--full" style="flex-direction:row;align-items:center;gap:1.2rem;flex-wrap:wrap">
    <button class="btn btn--gold btn--lg" type="submit">Solicitar diagnóstico
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <span class="form__msg" id="formMsg" role="status" aria-live="polite"></span>
  </div>
</form>
